syntax = "proto3";


service CastService {
    rpc IssueBallot (IssueBallotRequest) returns (IssueBallotResponse) {}
}

message IssueBallotRequest {
    string voter_id = 1;
    string voting_id = 2;
}

message IssueBallotResponse {
    map<string, SubjectContracts> subjects = 1;
}

message SubjectContracts {
    string contract_yes = 1;
    string contract_no = 2;
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Scala.js tests import @noble/* from node_modules
      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill') }}
          restore-keys: mill-${{ runner.os }}-

      - name: Compile
        run: ./mill --ticker false __.compile

      - name: Test
        run: ./mill --ticker false __.testForked

      - name: Link the Scala.js demo
        run: ./mill --ticker false products.demo.fullLinkJS
